name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml's test job. A concurrency group here would collide with the caller's.
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    # The maintainer's pool refuses a fork's job, so a fork's pull request runs on GitHub's runner.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'xcode-27' || 'prince-clockin-macos' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Test the core package
        run: swift test --package-path PrinceClockInCore
      - run: scripts/install-xcodegen.sh >> "$GITHUB_PATH"
      - name: Generate the project
        working-directory: PrinceClockIn
        run: xcodegen generate
      - name: Build the app
        working-directory: PrinceClockIn
        run: >-
          xcodebuild -scheme PrinceClockIn -configuration Debug
          -derivedDataPath ../build/DerivedData CODE_SIGNING_ALLOWED=NO build
